# ITACM — self-hosted stack: API + PostgreSQL, fully automatic provisioning.
#
#   cp .env.example .env       # then edit at least JWT_SECRET & ADMIN_*
#   docker compose up -d
#   docker compose logs api    # first-run admin credentials appear here
#
# The API applies the database schema and seeds the first Admin account on
# startup — no manual SQL, users, or permissions required.
#
# Persistence (DO NOT skip these volumes):
#   db-data  → PostgreSQL (assets, users, settings, …)
#   app-data → uploaded documents under /app/data (handover scans, contracts, …)
#
# WARNING: `docker compose down -v` DELETES both volumes (DB + document files).
# Prefer `docker compose down` (no -v) or `docker compose restart` for normal stops.
#
# Tip: only run this compose from ONE working directory per host. Two clones that
# both resolve to project name "itacm" share the same volumes but may use
# different .env passwords and cause auth failures.
#
# After `git pull`, UI updates apply immediately because ./public is bind-mounted.
# If the API image itself must refresh: FRONTEND_DIGEST=$(git rev-parse HEAD) docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itacm}
      POSTGRES_USER: ${POSTGRES_USER:-itacm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itacm_change_me}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itacm} -d ${POSTGRES_DB:-itacm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Uncomment to reach the DB from the host (psql, DBeaver, ...):
    # ports:
    #   - "5432:5432"

  api:
    build:
      context: .
      args:
        # Pass a changing digest so `docker compose build` always copies fresh public/.
        # Example: FRONTEND_DIGEST=$(git rev-parse HEAD) docker compose up -d --build
        FRONTEND_DIGEST: ${FRONTEND_DIGEST:-${GIT_COMMIT:-unknown}}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Named volume REQUIRED — without this, uploads die when the container is recreated.
    # Bind-mount public/ so a fresh git checkout always serves current UI (avoids
    # stale BuildKit COPY layers that Docker Desktop sometimes reuses across clones).
    volumes:
      - type: volume
        source: app-data
        target: /app/data
      - type: bind
        source: ./public
        target: /app/public
        read_only: true
    environment:
      DATA_BACKEND: postgres
      DATA_DIR: /app/data
      DATABASE_URL: postgres://${POSTGRES_USER:-itacm}:${POSTGRES_PASSWORD:-itacm_change_me}@db:5432/${POSTGRES_DB:-itacm}
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env (generate with openssl rand -hex 32)}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      JWT_REMEMBER_EXPIRES_IN: ${JWT_REMEMBER_EXPIRES_IN:-30d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-IT Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PORT: 8000
      # Set TRUST_PROXY=1 only behind a reverse proxy that sanitizes X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Rate limiting / brute-force (all optional; see .env.example). Set
      # RATE_LIMIT_TRUSTED_CIDRS to your office egress IP (e.g. 203.0.113.7/32)
      # so many colleagues behind one NAT IP aren't throttled as one visitor;
      # authentication and the per-account login lockout still apply.
      API_RATE_LIMIT: ${API_RATE_LIMIT:-1000}
      API_RATE_WINDOW_SEC: ${API_RATE_WINDOW_SEC:-300}
      USER_RATE_LIMIT: ${USER_RATE_LIMIT:-600}
      USER_RATE_WINDOW_SEC: ${USER_RATE_WINDOW_SEC:-300}
      LOGIN_FAIL_LIMIT: ${LOGIN_FAIL_LIMIT:-10}
      LOGIN_LOCK_MIN: ${LOGIN_LOCK_MIN:-15}
      RATE_LIMIT_TRUSTED_CIDRS: ${RATE_LIMIT_TRUSTED_CIDRS:-}
      # Automatic nightly DB backups (off by default). Files land in DATA_DIR/backups
      # (the api-data volume), verified and pruned to BACKUP_KEEP copies.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_DIR: ${BACKUP_DIR:-}
      # Single-provider SSO (OpenID Connect), invite-only. Off by default; the
      # redirect URI must be registered verbatim at the IdP. Secrets are env-only.
      SSO_ENABLED: ${SSO_ENABLED:-}
      SSO_ISSUER: ${SSO_ISSUER:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-}
      SSO_ALLOWED_DOMAINS: ${SSO_ALLOWED_DOMAINS:-}
      SSO_BUTTON_LABEL: ${SSO_BUTTON_LABEL:-}
      SSO_REQUIRE: ${SSO_REQUIRE:-}
      ONBOARDING_VIDEO_URL: ${ONBOARDING_VIDEO_URL:-}
      # AI assistant (optional — enable in Integrations → AI, or set AI_ENABLED=1)
      AI_ENABLED: ${AI_ENABLED:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ALLOW_PRIVATE: ${AI_ALLOW_PRIVATE:-1}
      # Zimmet PDF import: OCR for scanned forms (optional, CPU-heavy).
      # Put <lang>.traineddata under DATA_DIR/tessdata to keep it offline.
      ZIMMET_OCR: ${ZIMMET_OCR:-}
      ZIMMET_OCR_LANGS: ${ZIMMET_OCR_LANGS:-tur+eng}
      ZIMMET_OCR_LANG_PATH: ${ZIMMET_OCR_LANG_PATH:-}
      ZIMMET_OCR_MAX_PAGES: ${ZIMMET_OCR_MAX_PAGES:-40}
    extra_hosts:
      # So the API container can reach Ollama on the Docker host.
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # /api/health returns 503 when the DB is unreachable; wget exits non-zero
      # on that, so the container is flagged unhealthy. (wget ships in alpine.)
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional automatic-HTTPS reverse proxy. OFF by default — enable with:
  #   docker compose --profile tls up -d
  # Needs a real domain pointed at this host (DNS A/AAAA) + APP_DOMAIN in .env,
  # and set TRUST_PROXY=1 so the app reads the real client IP behind Caddy.
  # Caddy fetches + renews the Let's Encrypt certificate automatically.
  # (With the proxy in front you no longer need to publish the api port — set
  #  API_PORT=127.0.0.1:8000 in .env to keep it host-local.)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - caddy-data:/data
      - caddy-config:/config

  # HTTPS for a Cloudflare-PROXIED domain — uses a Cloudflare Origin Certificate
  # instead of Let's Encrypt (which can't be issued behind the orange cloud).
  # End-to-end TLS with Cloudflare SSL/TLS mode = Full (strict).
  #   docker compose --profile cloudflare up -d
  # Put the cert + key from Cloudflare (SSL/TLS → Origin Server) in ./certs as
  # origin.pem / origin.key, set APP_DOMAIN + TRUST_PROXY=1, and keep the api port
  # host-local (API_PORT=127.0.0.1:8000). Cloudflare reaches the origin on 443.
  caddy-cf:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["cloudflare"]
    depends_on:
      - api
    ports:
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    volumes:
      - type: bind
        source: ./Caddyfile.cloudflare
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ./certs
        target: /etc/caddy/certs
        read_only: true
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
    name: itacm_db-data
  app-data:
    name: itacm_app-data
  caddy-data:
    name: itacm_caddy-data
  caddy-config:
    name: itacm_caddy-config
