<title>ITACM — Installation Guide</title>
<style>
  :root{
    --bg:#f6f5fb; --card:#ffffff; --ink:#1b1b24; --muted:#56546a; --faint:#8b88a0;
    --line:#e7e3f2; --line-soft:#f0edf8;
    --accent:#4f46e5; --accent-deep:#3525cd; --accent-soft:#ece9fb;
    --term-bg:#161326; --term-ink:#e9e6f6; --term-prompt:#9d95f0; --term-line:#2b2740;
    --good:#15803d; --good-soft:#e7f5ec; --good-line:#c3e6ce;
    --radius:14px; --radius-sm:9px;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#100f18; --card:#1a1926; --ink:#eceaf5; --muted:#a6a2bd; --faint:#736f8c;
      --line:#2a2838; --line-soft:#211f2e;
      --accent:#8c84f1; --accent-deep:#a79ff6; --accent-soft:#211d38;
      --term-bg:#0c0b15; --term-ink:#e9e6f6; --term-prompt:#a79ff6; --term-line:#221f36;
      --good:#4ade80; --good-soft:#132a1d; --good-line:#1f4a30;
    }
  }
  :root[data-theme="dark"]{
    --bg:#100f18; --card:#1a1926; --ink:#eceaf5; --muted:#a6a2bd; --faint:#736f8c;
    --line:#2a2838; --line-soft:#211f2e;
    --accent:#8c84f1; --accent-deep:#a79ff6; --accent-soft:#211d38;
    --term-bg:#0c0b15; --term-ink:#e9e6f6; --term-prompt:#a79ff6; --term-line:#221f36;
    --good:#4ade80; --good-soft:#132a1d; --good-line:#1f4a30;
  }
  :root[data-theme="light"]{
    --bg:#f6f5fb; --card:#ffffff; --ink:#1b1b24; --muted:#56546a; --faint:#8b88a0;
    --line:#e7e3f2; --line-soft:#f0edf8;
    --accent:#4f46e5; --accent-deep:#3525cd; --accent-soft:#ece9fb;
    --term-bg:#161326; --term-ink:#e9e6f6; --term-prompt:#9d95f0; --term-line:#2b2740;
    --good:#15803d; --good-soft:#e7f5ec; --good-line:#c3e6ce;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased;margin:0}
  .page{max-width:760px;margin:0 auto;padding:44px 22px 80px}

  /* top bar */
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:34px}
  .brand{display:inline-flex;align-items:center;gap:11px}
  .brand .glyph{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;
    display:grid;place-items:center;box-shadow:0 4px 14px rgba(79,70,229,.32);flex:none}
  .brand .glyph svg{width:22px;height:22px}
  .brand b{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.1;display:block}
  .brand span{font-size:12px;color:var(--faint);display:block;font-weight:500}
  .lang{position:relative;flex:none}
  .lang select{appearance:none;-webkit-appearance:none;font-family:var(--sans);font-size:13px;
    font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:9px;padding:8px 30px 8px 12px;cursor:pointer}
  .lang svg{position:absolute;top:50%;right:9px;transform:translateY(-50%);width:15px;height:15px;
    color:var(--faint);pointer-events:none}
  [dir="rtl"] .lang select{padding:8px 12px 8px 30px}
  [dir="rtl"] .lang svg{right:auto;left:9px}
  .lang select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* header */
  .hero{margin-bottom:38px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);margin:0 0 12px}
  h1{font-size:clamp(28px,5vw,39px);line-height:1.1;letter-spacing:-.025em;font-weight:800;
    margin:0 0 14px;text-wrap:balance}
  .lede{font-size:17px;color:var(--muted);margin:0;max-width:62ch}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}
  h2{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}

  .prereq{margin-bottom:38px}
  .prereq ul{list-style:none;margin:0;padding:0;display:grid;gap:15px}
  .prereq li{display:flex;gap:13px;align-items:flex-start}
  .prereq .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;flex:none;margin-top:1px}
  .prereq .ic svg{width:17px;height:17px}
  .prereq b{font-weight:650;font-size:15px}
  .prereq p{margin:2px 0 0;font-size:14px;color:var(--muted)}
  .tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);
    border:1px solid var(--line);border-radius:20px;padding:1px 9px;margin:0 7px;vertical-align:2px}

  .sec-title{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);margin:0 0 20px}
  .steps{list-style:none;margin:0 0 38px;padding:0;position:relative}
  .steps:before{content:"";position:absolute;inset-inline-start:18px;top:14px;bottom:24px;width:2px;
    background:linear-gradient(var(--line),transparent);z-index:0}
  .step{display:grid;grid-template-columns:38px 1fr;gap:18px;position:relative;z-index:1;padding-bottom:26px}
  .num{width:38px;height:38px;border-radius:50%;background:var(--card);border:2px solid var(--accent);
    color:var(--accent);font-weight:800;font-size:16px;display:grid;place-items:center;
    font-variant-numeric:tabular-nums;flex:none}
  .step h3{margin:6px 0 6px;font-size:18px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  .step p{margin:0 0 13px;color:var(--muted);font-size:15px}
  .step p:last-child{margin-bottom:0}
  code.inl{font-family:var(--mono);font-size:.86em;background:var(--accent-soft);
    color:var(--accent-deep);padding:1px 6px;border-radius:6px;font-weight:600;direction:ltr;
    display:inline-block;unicode-bidi:embed}

  .term{background:var(--term-bg);border:1px solid var(--term-line);border-radius:var(--radius-sm);
    overflow:hidden;position:relative;direction:ltr}
  .term-bar{display:flex;gap:6px;padding:11px 13px 0}
  .term-bar i{width:10px;height:10px;border-radius:50%;background:#ffffff1f}
  .term pre{margin:0;padding:12px 15px 15px;overflow-x:auto}
  .term code{font-family:var(--mono);font-size:13.5px;line-height:1.75;color:var(--term-ink);white-space:pre}
  .term .p{color:var(--term-prompt);user-select:none;margin-right:9px}
  .term .cm{color:#8a86a8}
  .copy{position:absolute;top:9px;inset-inline-end:9px;font-family:var(--sans);font-size:11px;font-weight:600;
    letter-spacing:.03em;color:#c8c3ee;background:#ffffff14;border:1px solid #ffffff22;
    border-radius:7px;padding:4px 10px;cursor:pointer;transition:background .15s,color .15s}
  .copy:hover{background:#ffffff26;color:#fff}
  .copy.ok{background:var(--accent);border-color:var(--accent);color:#fff}

  .ninote{margin:12px 0 0;font-size:13px;color:var(--faint);display:flex;gap:8px;align-items:baseline;line-height:1.5}
  .ninote span{color:var(--accent);font-weight:800;flex:none}
  .callout{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:var(--line-soft);padding:14px 16px}
  .callout h4{margin:0 0 9px;font-size:13px;font-weight:700;color:var(--ink)}
  .callout ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
  .callout li{font-size:13.5px;color:var(--muted);display:flex;gap:9px;align-items:baseline}
  .callout li b{color:var(--ink);font-weight:650}
  .callout li .d{color:var(--accent);font-weight:800;flex:none}

  .done{background:var(--good-soft);border:1px solid var(--good-line);border-radius:var(--radius);
    padding:20px 24px;display:flex;gap:15px;align-items:center;margin-bottom:38px}
  .done .chk{width:38px;height:38px;border-radius:50%;background:var(--good);color:#fff;
    display:grid;place-items:center;flex:none}
  .done .chk svg{width:21px;height:21px}
  .done b{font-size:16px;display:block;color:var(--ink)}
  .done p{margin:2px 0 0;font-size:14px;color:var(--muted)}

  .grid2{display:grid;gap:18px;margin-bottom:36px}
  .update h2{color:var(--accent)}
  .update p{margin:0 0 14px;font-size:15px;color:var(--muted)}
  .trouble dl{margin:0;display:grid;gap:16px}
  .trouble dt{font-weight:650;font-size:14.5px;margin-bottom:4px}
  .trouble dd{margin:0;font-size:14px;color:var(--muted)}
  .trouble .term{margin-top:10px}

  footer{border-top:1px solid var(--line);padding-top:22px;display:flex;justify-content:space-between;
    align-items:center;gap:16px;flex-wrap:wrap;color:var(--faint);font-size:13px}
  footer a{color:var(--accent);font-weight:600;text-decoration:none}
  footer a:hover{text-decoration:underline}

  @media (max-width:520px){
    .page{padding:32px 16px 60px}
    .step{grid-template-columns:32px 1fr;gap:14px}
    .num{width:32px;height:32px;font-size:14px}
    .steps:before{inset-inline-start:15px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  pl:{eyebrow:"Przewodnik instalacji",title:"Zainstaluj ITACM na swoim serwerze",lede:"Samodzielnie hostowany system zarządzania zasobami IT, który należy w całości do Ciebie — bez chmury, bez abonamentu. Wykonuj kroki po kolei; wystarczy kopiować i wklejać polecenia.",

    stepsLabel:"Kroki",

    s2t:"Uruchom kreatora instalacji",s2d:"Zapyta o kilka rzeczy (konto admina, sposób dostępu) i wygeneruje hasła oraz plik .env za Ciebie — bez ręcznej edycji. Wszystko pozostaje prywatne na serwerze.",
    httpsQ:"Przy pytaniu „Jak będzie dostępny?” masz opcje:",o1:"Lokalnie / zwykły HTTP",o1d:"localhost lub IP. Najprostsze.",o2:"Własna domena",o2d:"automatyczny HTTPS przez Let's Encrypt — wpisujesz tylko domenę.",o3:"Za Cloudflare",o3d:"kreator objaśnia certyfikat; wklejasz go, a on zapisuje pliki.",
    s3t:"Uruchom",s3d:"Kreator pokaże dokładne polecenie — jedno z tych, zależnie od wyboru:",cm1:"# lokalnie / zwykły HTTP",cm2:"# za Cloudflare",
    s4t:"Odczytaj hasło admina",s4d:"Jeśli nie ustawiłeś własnego, konto admina utworzone przy pierwszym starcie jest w logach — poszukaj wiersza „Owner account created”.",
    s5t:"Otwórz w przeglądarce i zakończ",s5d:"Wejdź na https://twoja-domena (lub http://ip-serwera). Na ekranie startowym podaj nazwę firmy i konto Owner. Gotowe.",
    doneT:"Instalacja zakończona.",doneD:"Aplikacja działa. Wersja jest na dole lewego paska bocznego.",

    t3q:"Zablokowany / zapomniane hasło admina",t3a:"Zresetuj je z serwera (wymusza nowe przy następnym logowaniu):",
    footer:"Wszystkie szczegóły i opcje zaawansowane znajdziesz w repozytorium.",readme:"README →"},

  ru:{eyebrow:"Руководство по установке",title:"Установите ITACM на свой сервер",lede:"Самостоятельно размещаемая система учёта IT-активов, полностью ваша — без облака и подписки. Выполняйте шаги по порядку; достаточно копировать и вставлять команды.",
    prereqTitle:"Перед началом",p1t:"Публично доступный сервер",p1d:"Машина с Docker и Node.js — ваш собственный VPS (Hetzner, DigitalOcean и т. п.). Подойдёт чистый Ubuntu.",p2t:"Доменное имя",p2tag:"необязательно",p2d:"Нужно только для HTTPS (зелёный замок). Без него работает по обычному HTTP на IP сервера.",
    stepsLabel:"Шаги",
    s1t:"Скачать код на сервер",s1d:"Подключитесь к серверу, клонируйте проект и войдите в папку. Если git не установлен, установите его сначала (напр. sudo apt install git).",
    s2t:"Запустить мастер установки",s2d:"Он задаст пару вопросов (учётка администратора, способ доступа) и создаст пароли и файл .env за вас — без ручного редактирования. Всё остаётся приватным на сервере.",
    httpsQ:"На вопрос «Как будет доступен?» варианты:",o1:"Локально / простой HTTP",o1d:"localhost или IP-адрес. Самое простое.",o2:"Свой домен",o2d:"автоматический HTTPS через Let's Encrypt — вы просто вводите домен.",o3:"За Cloudflare",o3d:"мастер объяснит сертификат; вы вставляете его, он сохраняет файлы.",
    s3t:"Запустить",s3d:"Мастер покажет точную команду — одну из этих, в зависимости от выбора:",cm1:"# локально / простой HTTP",cm2:"# за Cloudflare",
    s4t:"Получить пароль администратора",s4d:"Если вы не задали свой, созданная при первом запуске учётка администратора есть в логах — найдите строку «Owner account created».",
    s5t:"Открыть в браузере и завершить",s5d:"Откройте https://ваш-домен (или http://ip-сервера). На стартовом экране укажите название компании и учётку Owner. Готово.",
    doneT:"Установка завершена.",doneD:"Приложение работает. Версия показана внизу левой боковой панели.",
    updateT:"Обновление",updateD:"Когда выходит новая версия, одна команда делает всё — резервная копия, свежий код, перезапуск с правильными настройками. Флаги запоминать не нужно.",
    troubleT:"Если застряли",
    t1q:"«Web server is down» / ошибка 521",t1a:"Режим SSL в Cloudflare не совпадает с origin. Установите Cloudflare → SSL/TLS → Full (strict) (или Flexible как быстрое решение).",
    t2q:"Новая кнопка/функция не работает",t2a:"Бэкенд устарел. Выполните npm run update — он пересоберёт образ.",
    t3q:"Заблокированы / забыли пароль администратора",t3a:"Сбросьте его с сервера (потребует новый при следующем входе):",
    footer:"Все подробности и расширенные опции — в репозитории.",readme:"README →"},

  ar:{eyebrow:"دليل التثبيت",title:"ثبّت ITACM على خادمك",lede:"نظام إدارة أصول تقنية المعلومات مُستضاف ذاتيًا ومِلكٌ لك بالكامل — دون سحابة ودون اشتراك. اتبع الخطوات بالترتيب؛ يكفي نسخ الأوامر ولصقها.",
    prereqTitle:"قبل أن تبدأ",p1t:"خادم يمكن الوصول إليه علنًا",p1d:"جهاز مثبَّت عليه Docker وNode.js — خادمك الخاص (Hetzner، DigitalOcean، إلخ). يكفي Ubuntu جديد.",p2t:"اسم نطاق",p2tag:"اختياري",p2d:"مطلوب فقط لـ HTTPS (القفل الأخضر). بدونه يعمل عبر HTTP عادي على عنوان IP للخادم.",
    stepsLabel:"الخطوات",
    s1t:"نزّل الكود إلى الخادم",s1d:"اتصل بخادمك، استنسخ المشروع وادخل المجلد. إن لم يكن git مثبتًا، ثبّته أولًا (مثل sudo apt install git).",
    s2t:"شغّل معالج الإعداد",s2d:"يسألك بضعة أشياء (حساب المسؤول، طريقة الوصول) ويولّد كلمات المرور وملف .env نيابةً عنك — دون تحرير يدوي. كل ما يكتبه يبقى خاصًا على الخادم.",
    httpsQ:"عند سؤال «كيف سيتم الوصول؟» خياراتك:",o1:"محلي / HTTP عادي",o1d:"localhost أو عنوان IP. الأبسط.",o2:"نطاقك الخاص",o2d:"HTTPS تلقائي عبر Let's Encrypt — تكتب النطاق فقط.",o3:"خلف Cloudflare",o3d:"يشرح المعالج كيفية الحصول على الشهادة؛ تلصقها ويحفظ الملفات نيابةً عنك.",
    s3t:"التشغيل",s3d:"يعرض المعالج الأمر الدقيق — أحد هذه حسب اختيارك:",cm1:"# محلي / HTTP عادي",cm2:"# خلف Cloudflare",
    s4t:"احصل على كلمة مرور المسؤول",s4d:"إن لم تحدد واحدة، يظهر حساب المسؤول المُنشأ عند أول تشغيل في السجلات — ابحث عن سطر «Owner account created».",
    s5t:"افتحه في المتصفح وأكمِل",s5d:"اذهب إلى https://نطاقك (أو http://عنوان-الخادم). في الشاشة الأولى أدخل اسم الشركة وحساب Owner. تم.",
    doneT:"اكتمل التثبيت.",doneD:"التطبيق يعمل. يظهر رقم الإصدار أسفل الشريط الجانبي الأيسر.",
    updateT:"التحديث",updateD:"عند صدور إصدار جديد، أمر واحد يفعل كل شيء — نسخة احتياطية، أحدث كود، وإعادة تشغيل بالإعدادات الصحيحة. لا رايات لتتذكرها.",
    troubleT:"إذا واجهت مشكلة",
    t1q:"«Web server is down» / خطأ 521",t1a:"وضع SSL في Cloudflare لا يطابق الخادم الأصلي. اضبط Cloudflare ← SSL/TLS ← Full (strict) (أو Flexible كحل سريع).",
    t2q:"زر/ميزة جديدة لا تعمل",t2a:"الخلفية قديمة. شغّل npm run update — يعيد بناء الصورة.",
    t3q:"محظور / نسيت كلمة مرور المسؤول",t3a:"أعد تعيينها من الخادم (تفرض كلمة جديدة عند الدخول التالي):",
    footer:"لكل التفاصيل والخيارات المتقدمة، راجع المستودع.",readme:"README ←"},

  ja:{eyebrow:"インストールガイド",title:"サーバーに ITACM を設置",lede:"完全にあなたのものになる、自己ホスト型の IT 資産管理システム — クラウド不要、サブスク不要。手順を順に進めてください。コマンドはコピー＆ペーストするだけです。",
    prereqTitle:"始める前に",p1t:"公開アクセス可能なサーバー",p1d:"Docker と Node.js が入ったマシン — 自分の VPS（Hetzner、DigitalOcean など）。まっさらな Ubuntu で十分です。",p2t:"ドメイン名",p2tag:"任意",p2d:"HTTPS（緑の鍵）に必要なだけです。なくてもサーバーの IP 上で通常の HTTP で動きます。",
    stepsLabel:"手順",
    s1t:"コードをサーバーに取得",s1d:"サーバーに接続し、プロジェクトをクローンしてフォルダに入ります。git が未インストールなら先に入れてください（例: sudo apt install git）。",
    s2t:"セットアップウィザードを実行",s2d:"いくつか質問（管理者アカウント、アクセス方法）を行い、パスワードと .env ファイルを自動生成します — 手動編集は不要。書き込む内容はサーバー上で非公開のままです。",
    httpsQ:"「どうアクセスしますか？」の選択肢:",o1:"ローカル / 素の HTTP",o1d:"localhost または IP。最も簡単。",o2:"自分のドメイン",o2d:"Let's Encrypt による自動 HTTPS — ドメインを入力するだけ。",o3:"Cloudflare の背後",o3d:"証明書の取得方法を案内。貼り付けるとファイルを保存してくれます。",
    s3t:"起動",s3d:"ウィザードが正確なコマンドを表示します — 選択に応じて次のいずれか:",cm1:"# ローカル / 素の HTTP",cm2:"# Cloudflare の背後",
    s4t:"管理者パスワードを取得",s4d:"自分で設定しなかった場合、初回起動時に作られた管理者アカウントはログに表示されます —「Owner account created」の行を探してください。",
    s5t:"ブラウザで開いて完了",s5d:"https://あなたのドメイン（または http://サーバーIP）を開きます。初回画面で会社名と Owner アカウントを入力。以上です。",
    doneT:"セットアップ完了。",doneD:"アプリが稼働中です。バージョンは左サイドバー下部に表示されます。",
    updateT:"アップデート",updateD:"新しいバージョンが出たら、1 つのコマンドで完了 — バックアップ、最新コード、正しい設定で再起動。覚えるフラグはありません。",
    troubleT:"うまくいかないとき",
    t1q:"「Web server is down」/ エラー 521",t1a:"Cloudflare の SSL モードがオリジンと不一致です。Cloudflare → SSL/TLS → Full (strict)（または応急的に Flexible）に。",
    t2q:"新しいボタン/機能が動かない",t2a:"バックエンドが古いままです。npm run update を実行 — イメージを再ビルドします。",
    t3q:"ロックアウト / 管理者パスワードを忘れた",t3a:"サーバーからリセット（次回サインイン時に新しいパスワードを要求）:",
    footer:"すべての詳細と高度なオプションはリポジトリを参照。",readme:"README →"}
  };

  var esc = function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};
  var term = function(cmd, copy, comment){
    var body = cmd.split("\n").map(function(l){ return '<span class="p">$</span>'+esc(l); }).join("\n");
    if(comment){ body = comment.replace(/\n/g,"\n") + "\n" + body; }
    return '<div class="term"><div class="term-bar"><i></i><i></i><i></i></div>'+
      '<pre><code>'+body+'</code></pre>'+
      '<button class="copy" type="button" data-copy="'+esc(copy).replace(/"/g,"&quot;")+'">'+"⧉"+'</button></div>';
  };

  function render(lang){
    var d = T[lang] || T.en;
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang==="ar") ? "rtl" : "ltr";
    var startCmd =
      '<div class="term"><div class="term-bar"><i></i><i></i><i></i></div>'+
      '<pre><code><span class="cm">'+esc(d.cm1)+'</span>\n<span class="p">$</span>docker compose up -d\n\n'+
      '<span class="cm">'+esc(d.cm2)+'</span>\n<span class="p">$</span>docker compose --profile cloudflare up -d</code></pre>'+
      '<button class="copy" type="button" data-copy="docker compose up -d">⧉</button></div>';

    document.getElementById("content").innerHTML =
      '<header class="hero">'+
        '<p class="eyebrow">'+esc(d.eyebrow)+'</p>'+
        '<h1>'+esc(d.title)+'</h1>'+
        '<p class="lede">'+esc(d.lede)+'</p>'+
      '</header>'+

      '<section class="prereq card">'+
        '<h2>'+esc(d.prereqTitle)+'</h2>'+
        '<ul>'+
          '<li><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>'+
            '<div><b>'+esc(d.p1t)+'</b><p>'+esc(d.p1d)+'</p></div></li>'+
          '<li><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg></span>'+
            '<div><b>'+esc(d.p2t)+'<span class="tag">'+esc(d.p2tag)+'</span></b><p>'+esc(d.p2d)+'</p></div></li>'+
        '</ul>'+
      '</section>'+

      '<p class="sec-title">'+esc(d.stepsLabel)+'</p>'+
      '<ol class="steps">'+
        '<li class="step"><div class="num">1</div><div class="body"><h3>'+esc(d.s1t)+'</h3><p>'+esc(d.s1d)+'</p>'+term(C.clone,C.clone)+'</div></li>'+
        '<li class="step"><div class="num">2</div><div class="body"><h3>'+esc(d.s2t)+'</h3><p>'+esc(d.s2d)+'</p>'+term(C.setup,C.setup)+
          '<p class="ninote"><span aria-hidden="true">ℹ</span> '+esc(NI[lang]||NI.en)+'</p>'+
          '<div class="callout"><h4>'+esc(d.httpsQ)+'</h4><ul>'+
            '<li><span class="d">1</span><span><b>'+esc(d.o1)+'</b> — '+esc(d.o1d)+'</span></li>'+
            '<li><span class="d">2</span><span><b>'+esc(d.o2)+'</b> — '+esc(d.o2d)+'</span></li>'+
            '<li><span class="d">3</span><span><b>'+esc(d.o3)+'</b> — '+esc(d.o3d)+'</span></li>'+
          '</ul></div></div></li>'+
        '<li class="step"><div class="num">3</div><div class="body"><h3>'+esc(d.s3t)+'</h3><p>'+esc(d.s3d)+'</p>'+startCmd+'</div></li>'+
        '<li class="step"><div class="num">4</div><div class="body"><h3>'+esc(d.s4t)+'</h3><p>'+esc(d.s4d)+'</p>'+term(C.logs,C.logs)+'</div></li>'+
        '<li class="step"><div class="num">5</div><div class="body"><h3>'+esc(d.s5t)+'</h3><p>'+esc(d.s5d)+'</p></div></li>'+
      '</ol>'+

      '<div class="done"><span class="chk" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>'+
        '<div><b>'+esc(d.doneT)+'</b><p>'+esc(d.doneD)+'</p></div></div>'+

      '<div class="grid2">'+
        '<section class="update card"><h2>'+esc(d.updateT)+'</h2><p>'+esc(d.updateD)+'</p>'+term(C.update,C.update)+'</section>'+
        '<section class="trouble card"><h2>'+esc(d.troubleT)+'</h2><dl>'+
          '<div><dt>'+esc(d.t1q)+'</dt><dd>'+esc(d.t1a)+'</dd></div>'+
          '<div><dt>'+esc(d.t2q)+'</dt><dd>'+esc(d.t2a)+'</dd></div>'+
          '<div><dt>'+esc(d.t3q)+'</dt><dd>'+esc(d.t3a)+'</dd>'+term(C.reset,C.reset)+'</div>'+
        '</dl></section>'+
      '</div>'+

      '<footer><span>'+esc(d.footer)+'</span><a href="https://github.com/enesyaks/ITACM#readme" target="_blank" rel="noopener">'+esc(d.readme)+'</a></footer>';
  }

  // language selector
  var sel = document.getElementById("lang");
  ORDER.forEach(function(code){
    var o = document.createElement("option"); o.value = code; o.textContent = NAMES[code]; sel.appendChild(o);
  });
  var initial = (function(){
    try{ var s = localStorage.getItem("itacm_guide_lang"); if(s && T[s]) return s; }catch(e){}
    var b = (navigator.language||"en").slice(0,2).toLowerCase();
    return T[b] ? b : "en";
  })();
  sel.value = initial;
  render(initial);
  sel.addEventListener("change", function(){
    render(sel.value);
    try{ localStorage.setItem("itacm_guide_lang", sel.value); }catch(e){}
  });

  // copy (delegated)
  document.getElementById("content").addEventListener("click", function(e){
    var btn = e.target.closest(".copy"); if(!btn) return;
    var text = btn.getAttribute("data-copy")||"";
    if(navigator.clipboard) navigator.clipboard.writeText(text).then(function(){
      btn.textContent = "✓"; btn.classList.add("ok");
      setTimeout(function(){ btn.textContent = "⧉"; btn.classList.remove("ok"); }, 1300);
    });
  });
})();
</script>
